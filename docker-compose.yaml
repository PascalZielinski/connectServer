services:
    migrate:
        build:
            context: .
            dockerfile: dockerfile
        working_dir: /var/www/html
        command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction"]
        restart: "no"
        volumes:
            - .:/var/www/html
        depends_on:
            db:
                condition: service_healthy

    web:
        build:
            context: .
            dockerfile: dockerfile
        working_dir: /var/www/html
        command:
            - sh
            - -c
            - >-
                mkdir -p var/uploads &&
                chown www-data:www-data var/uploads &&
                chmod 0700 var/uploads &&
                mkdir -p public/uploads/images &&
                chgrp -R www-data public/uploads &&
                chmod -R g+rwX public/uploads &&
                find public/uploads -type d -exec chmod g+s {} + &&
                exec apache2-foreground
        volumes:
            - .:/var/www/html
            - uploads_data:/var/www/html/var/uploads
        ports:
            - "8080:80"
        depends_on:
            migrate:
                condition: service_completed_successfully
        environment:
            APACHE_DOCUMENT_ROOT: /var/www/html/public
            MAILER_FROM: ${MAILER_FROM:-noreply@example.com}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
            MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
            MERCURE_JWT_SECRET: '${MERCURE_JWT_SECRET}'

    upload-worker:
        build:
            context: .
            dockerfile: dockerfile
        working_dir: /var/www/html
        user: www-data
        command:
            - sh
            - -c
            - >-
                until [ -w var/uploads ]; do sleep 1; done &&
                exec php bin/console app:uploads:cleanup
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - uploads_data:/var/www/html/var/uploads
        depends_on:
            migrate:
                condition: service_completed_successfully
            web:
                condition: service_started
        environment:
            MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}

    db:
        image: mariadb:10.4.32
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: connectServer
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
        ports:
            - "3307:3306"
        volumes:
            - db_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    phpmyadmin:
        image: arm64v8/phpmyadmin
        restart: always
        ports:
            - "8081:80"
        environment:
            PMA_HOST: db
            MYSQL_ROOT_PASSWORD: root
            UPLOAD_LIMIT: 256M

    livekit:
        image: livekit/livekit-server:latest
        network_mode: host
        restart: unless-stopped
        environment:
            LIVEKIT_CONFIG: |
                port: 7880
                rtc:
                  tcp_port: 7881
                  port_range_start: 50000
                  port_range_end: 50200
                  use_external_ip: true
                keys:
                    ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}

    mercure:
        image: dunglas/mercure:v0
        restart: unless-stopped
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: '${MERCURE_JWT_SECRET}'
            MERCURE_SUBSCRIBER_JWT_KEY: '${MERCURE_JWT_SECRET}'
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins http://localhost:5173
        ports:
            - "3100:80"
        volumes:
            - mercure_data:/data
            - mercure_config:/config

volumes:
    db_data:
    uploads_data:
    mercure_data:
    mercure_config: