framework:
    rate_limiter:
        chat_message:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '1 second', amount: 1 }
        chat_message_minute:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
        chat_typing:
            policy: 'token_bucket'
            limit: 3
            rate: { interval: '3 seconds', amount: 1 }

        refresh:
            policy: 'sliding_window'
            limit: 10
            interval: '1 minute'

        upload:
            policy: 'token_bucket'
            limit: 5
            rate: { interval: '10 minutes', amount: 3 }
        upload_daily:
            policy: 'sliding_window'
            limit: 100
            interval: '24 hours'

        login:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'
        login_account:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'
        register:
            policy: 'fixed_window'
            limit: 3
            interval: '1 hour'
        register_account:
            policy: 'sliding_window'
            limit: 3
            interval: '1 hour'
        password_reset:
            policy: 'fixed_window'
            limit: 3
            interval: '1 hour'
        voice_token:
            policy: 'token_bucket'
            limit: 10
            rate: { interval: '1 minute', amount: 5 }

        anonymous_api:
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'
        authenticated_api:
            policy: 'token_bucket'
            limit: 300
            rate: { interval: '1 second', amount: 5 }

        login_confirm_mail:
            policy: 'fixed_window'
            limit: 1
            interval: '5 minutes'
        login_confirm_mail_daily:
            policy: 'sliding_window'
            limit: 5
            interval: '24 hours'
        mail_verification:
            policy: 'fixed_window'
            limit: 1
            interval: '5 minutes'
        mail_account_exists:
            policy: 'fixed_window'
            limit: 1
            interval: '15 minutes'
        mail_account_exists_daily:
            policy: 'sliding_window'
            limit: 3
            interval: '24 hours'

symfonycasts_verify_email:
    lifetime: 1800